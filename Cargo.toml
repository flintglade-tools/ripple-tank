[package]
name = "flintglade-ripple"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Deterministic gravity-capillary ripple tank with native and WebAssembly interfaces"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
libm = "=0.2.16"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.release]
lto = true
codegen-units = 1
